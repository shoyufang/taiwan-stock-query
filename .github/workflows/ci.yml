name: CI
on:
  push:
    branches: [main, local]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov ruff
      - name: Lint (僅擋嚴重錯誤)
        run: ruff check . --select E9,F63,F7,F82
      - name: Tests
        run: pytest
