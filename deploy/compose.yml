# 新網站（B 方案）部署設定。部署於 home server，見 docs/plans/FRONTEND_REWRITE_ARCH_2026-10.md
# 用法：docker compose -f deploy/compose.yml up -d --build
# 需要 deploy/.env（不進 git，欄位見 deploy/.env.example）。
name: twstock

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_VERSION: ${APP_VERSION:-dev}
      TZ: Asia/Taipei
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../frontend
    # 只綁本機：開機時一定綁得到。對外由 tailnet-proxy 轉發，絕不綁 0.0.0.0
    ports:
      - "127.0.0.1:8600:80"
    depends_on:
      - api
    restart: unless-stopped

  # 把 Tailscale IP 的 8600 轉到本機 8600。開機時 Docker 可能比 Tailscale 先起，
  # 所以先等 BIND_IP 出現在網卡上再開始監聽；不需要改主機系統設定。
  tailnet-proxy:
    image: alpine/socat:1.8.0.3
    network_mode: host
    entrypoint: ["sh", "-c"]
    command:
      - |
        until ip -o addr | grep -q " $$BIND_IP/"; do echo "waiting for $$BIND_IP"; sleep 5; done
        echo "listening on $$BIND_IP:8600"
        exec socat TCP-LISTEN:8600,bind=$$BIND_IP,reuseaddr,fork TCP:127.0.0.1:8600
    environment:
      BIND_IP: ${BIND_IP:?deploy/.env 必須設定 BIND_IP（home server 的 Tailscale IP）}
    depends_on:
      - web
    restart: unless-stopped
