# 新網站（B 方案）部署設定。部署於 home server，見 docs/plans/FRONTEND_REWRITE_ARCH_2026-10.md
# 用法：docker compose -f deploy/compose.yml up -d --build
# 需要 deploy/.env（不進 git，欄位見 deploy/.env.example）。
name: twstock

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_VERSION: ${APP_VERSION:-dev}
      TZ: Asia/Taipei
      STORE_PATH: /data/twstock.db
      FINMIND_TOKEN: ${FINMIND_TOKEN:-}
      PUBLIC_URL: http://${BIND_IP}:8600
      NTFY_URL: http://ntfy:80/
      NTFY_TOPIC: twstock
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      AGNES_MODEL: ${AGNES_MODEL:-}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-}
      MCP_URL: http://twse-mcp:8000/mcp
    volumes:
      - twstock-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 預先計算（市場總覽每 10 分鐘），與 api 同一份映像
  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Taipei
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 即時行情（全站唯一的永豐金連線，只在交易時段登入）。金鑰在 deploy/.env：
  # SHIOAJI_API_KEY、SHIOAJI_SECRET_KEY、SHIOAJI_SIMULATION（true／false）
  quote:
    build:
      context: ..
      dockerfile: backend/Dockerfile.quote
    environment:
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Taipei
      SHIOAJI_API_KEY: ${SHIOAJI_API_KEY:-}
      SHIOAJI_SECRET_KEY: ${SHIOAJI_SECRET_KEY:-}
      SHIOAJI_SIMULATION: ${SHIOAJI_SIMULATION:-true}
      QUOTE_FORCE_SESSION: ${QUOTE_FORCE_SESSION:-0}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # AI 助理的資料工具：自架 TWStockMCPServer（MIT，github.com/twjackysu/TWSEMCPServer）。
  # 只在 compose 內網供 api 使用，不對外開 port。鎖定映像 digest，升版時更新這裡。
  twse-mcp:
    image: ghcr.io/twjackysu/twsemcpserver@sha256:c9bb900fffd381432ff261c166285102e63728d48a018f2a341e61a58c587b20
    environment:
      TZ: Asia/Taipei
    restart: unless-stopped

  web:
    build:
      context: ../frontend
    # 只綁本機：開機時一定綁得到。對外由 tailnet-proxy 轉發，絕不綁 0.0.0.0
    ports:
      - "127.0.0.1:8600:80"
    depends_on:
      - api
    restart: unless-stopped

  # 手機推播（ntfy 自架）。手機 App 訂閱 http://<Tailscale IP>:8601/twstock
  # upstream 設 ntfy.sh 是為了 iPhone 能即時收到（只轉送訊息 ID 的輪詢通知，內容不經過 ntfy.sh）
  ntfy:
    image: binwiederhier/ntfy:v2.17.0
    command: ["serve"]
    environment:
      NTFY_BASE_URL: http://${BIND_IP}:8601
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      TZ: Asia/Taipei
    volumes:
      - ntfy-cache:/var/cache/ntfy
    ports:
      - "127.0.0.1:8601:80"
    restart: unless-stopped

  # 把 Tailscale IP 的 8600（網站）、8601（ntfy）轉到本機。開機時 Docker 可能比 Tailscale 先起，
  # 所以先等 BIND_IP 出現在網卡上再開始監聽；不需要改主機系統設定。
  tailnet-proxy:
    image: alpine/socat:1.8.0.3
    network_mode: host
    entrypoint: ["sh", "-c"]
    command:
      - |
        until ip -o addr | grep -q " $$BIND_IP/"; do echo "waiting for $$BIND_IP"; sleep 5; done
        echo "listening on $$BIND_IP:8600 and :8601"
        socat TCP-LISTEN:8601,bind=$$BIND_IP,reuseaddr,fork TCP:127.0.0.1:8601 &
        exec socat TCP-LISTEN:8600,bind=$$BIND_IP,reuseaddr,fork TCP:127.0.0.1:8600
    environment:
      BIND_IP: ${BIND_IP:?deploy/.env 必須設定 BIND_IP（home server 的 Tailscale IP）}
    depends_on:
      - web
      - ntfy
    restart: unless-stopped

volumes:
  twstock-data:
  ntfy-cache:
